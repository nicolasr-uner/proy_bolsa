[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proybolsa"
version = "0.1.0"
description = "Proyeccion de precio de bolsa horario e IPP (Colombia) con auto-recalibracion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Versiones fijas a un conjunto validado en este entorno.
# Nota critica: pydataxm 0.3.x usa freq='M' internamente y ROMPE con pandas>=3.0,
# por eso pandas se fija en la rama 2.2.x. numpy 2.1.x es el ultimo compatible con
# numba 0.65 (motor de statsforecast).
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow>=14",
  "requests>=2.31",
  "pydataxm==0.3.17",
  "statsforecast==2.0.3",
  "statsmodels==0.14.6",
  "mlforecast==1.0.31",
  "utilsforecast==0.2.16",
  "lightgbm==4.6.0",
  "scikit-learn==1.9.0",
  "pandera==0.31.1",
  "pyyaml==6.0.3",
  "matplotlib==3.11.0",
  "plotly==6.8.0",
]

[project.optional-dependencies]
# Las fuentes externas (FRED, datos.gov.co) se consumen con requests + pandas
# (core), sin dependencias extra. pandas-datareader se descarto: rompe en
# Python 3.12 al importar distutils (eliminado del stdlib).
dev = ["pytest==9.1.0", "ruff>=0.6"]
viz = ["streamlit>=1.36"]
track = ["mlflow>=2.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
