# Diccionario de variables y supuestos: modelo de IPP.
# [CONFIRMADO] = fuente verificada con consulta real (junio 2026).
# Las fuentes externas se consumen con requests + pandas (REST), sin libs extra.

objetivo:
  ipp:
    descripcion: Indice de Precios del Productor - Oferta Interna
    fuente: DANE (oficial); alternativa Banco de la Republica
    granularidad: mensual
    base: dic-2014 = 100
    transformacion: "variacion mensual (log-dif); modelar nivel o variacion"
    confianza: alta
    estado: "[POR VALIDAR Fase 2] DANE no tiene API REST limpia; explorar datos.gov.co / boletines / SDMX BanRep"
    nota: "DANE publica un dato PROVISIONAL y lo revisa el mes siguiente -> el loop debe re-incorporar la version definitiva."

drivers:
  trm:
    descripcion: Tasa de cambio representativa del mercado (USD/COP)
    fuente: datos.gov.co (Socrata)
    dataset_id: "32sa-8pi3"          # [CONFIRMADO] campos: valor, unidad, vigenciadesde, vigenciahasta
    acceso: "https://www.datos.gov.co/resource/32sa-8pi3.json"
    granularidad: diaria -> promedio mensual
    unidad: COP/USD
    transformacion: "variacion mensual; rezagos 0-2 meses"
    confianza: alta
  brent:
    descripcion: Precio internacional del petroleo (Brent)
    fuente: FRED (descarga CSV directa)
    serie_id: "DCOILBRENTEU"         # [CONFIRMADO] diaria, USD/barril
    acceso: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILBRENTEU"
    granularidad: diaria -> promedio mensual
    transformacion: "variacion mensual; rezagos 0-2 meses"
    confianza: alta
  ppi_usa:
    descripcion: Producer Price Index de EE.UU. (transmision internacional)
    fuente: FRED (descarga CSV directa)
    serie_id: "PPIACO"               # [CONFIRMADO] mensual
    acceso: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=PPIACO"
    granularidad: mensual
    confianza: media

cointegracion:
  descripcion: "Relacion de largo plazo IPP ~ TRM + Brent (test de Johansen -> VECM)"
  variables: [ipp, trm, brent]

supuestos_generales:
  - "El IPP de oferta interna es sensible a TRM y commodities (economia abierta)."
  - "El IPP suele anticipar al IPC (util para nowcasting futuro)."
  - "Las revisiones mensuales de DANE se tratan como nueva informacion, no como error del modelo."
