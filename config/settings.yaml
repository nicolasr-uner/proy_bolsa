# Configuracion general del proyecto.

proyecto:
  zona_horaria: America/Bogota
  moneda: COP

horizontes:
  bolsa:
    operativo_dias: 7      # dia/semana siguiente (operacion)
    tactico_dias: 90       # 1-3 meses (presupuesto/gestion)
    largo_meses: 24        # valoracion de PPAs
  ipp:
    meses: 12

backtest:
  esquema: rolling_origin   # walk-forward (reemplaza el hold-out unico del modelo R)
  paso_dias: 30
  ventana_min_dias_bolsa: 730   # ~2 anios de entrenamiento minimo
  ventana_min_meses_ipp: 60     # ~5 anios
  metricas: [rmse, mae, mape, smape]

datos:
  historico_anios: 3
  ruta_raw: data/raw
  ruta_processed: data/processed

alertas:
  # Si el MAPE del backtest mensual supera estos umbrales, disparar re-busqueda de modelo.
  umbral_mape_bolsa: 20.0
  umbral_mape_ipp: 1.5
