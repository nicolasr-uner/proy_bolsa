# Diccionario de variables y supuestos: modelo de PRECIO DE BOLSA.
# Estado: las metricas de XM marcadas [VALIDADO] se confirmaron con una consulta
# real (junio 2026). Las marcadas [POR CONFIRMAR] se mapearan en la Fase 2 contra
# el catalogo de 193 metricas de la API (ver scripts/check_pydataxm.py).

objetivo:
  precio_bolsa:
    descripcion: Precio de Bolsa Nacional (horario)
    fuente: XM API (pydataxm)
    metric_id: PrecBolsNaci          # [VALIDADO]
    entidad: Sistema
    granularidad: horaria
    unidad: COP/kWh
    transformacion: "ancho 24h -> serie horaria larga; log(precio) para modelar el nivel"
    confianza: alta

drivers:
  precio_escasez:
    descripcion: Precio de escasez (techo regulatorio que ancla los picos)
    fuente: XM API
    metric_id: PrecEsca              # [VALIDADO]  ~861 COP/kWh en may-2026
    entidad: Sistema
    granularidad: diaria
    unidad: COP/kWh
    rol: techo / cota superior en el modelo de largo plazo
    confianza: alta
  precio_oferta_ideal:
    descripcion: Precio de oferta del despacho ideal (senal estructural)
    fuente: XM API
    metric_id: PrecOferIdeal         # [VALIDADO en catalogo]
    entidad: Recurso
    granularidad: diaria
    confianza: alta
  aportes_hidricos:
    descripcion: Aportes hidricos (energia), driver Tier 1 en mercado hidro
    fuente: XM API
    metric_id: (por confirmar)       # [POR CONFIRMAR] buscar "Aporte" en catalogo
    granularidad: diaria
    unidad: GWh / % del promedio historico
    transformacion: "ratio aportes/media historica; rezagos 1,7,30"
    confianza: alta
  nivel_embalses:
    descripcion: Volumen util diario de embalses (energia almacenada)
    fuente: XM API
    metric_id: (por confirmar)       # [POR CONFIRMAR] buscar "Volu" / "Embalse"
    granularidad: diaria
    unidad: GWh / % capacidad util
    confianza: alta
  demanda:
    descripcion: Demanda comercial / del SIN
    fuente: XM API
    metric_id: (por confirmar)       # [POR CONFIRMAR] buscar "Dema"
    granularidad: horaria
    unidad: kWh
    confianza: alta
  generacion_por_recurso:
    descripcion: Generacion real por tipo (hidro, termica, solar, eolica)
    fuente: XM API
    metric_id: (por confirmar)       # [POR CONFIRMAR] buscar "Gene"
    granularidad: horaria
    confianza: media
  enso_oni:
    descripcion: Indice ONI (El Nino / La Nina); regimen hidrologico
    fuente: NOAA CPC / IDEAM
    metric_id: n/a (descarga aparte)
    granularidad: mensual
    transformacion: "dummy regimen El Nino (ONI > 0.5); rezagos 1-3 meses"
    confianza: media
  combustibles:
    descripcion: Precios de gas y carbon (costo marginal termico)
    fuente: carga semi-manual (sin API gratuita confiable)
    granularidad: mensual
    confianza: media
    supuesto: "se actualiza manualmente; si falta, se usa ultimo valor + escenario"

supuestos_generales:
  - "El nivel diario de precio lo explican fundamentales (hidrologia, demanda, ENSO)."
  - "El perfil horario (forma 24h) es estable por tipo de dia (habil/sabado/domingo/festivo) y mes."
  - "El precio de escasez actua como cota superior estructural."
